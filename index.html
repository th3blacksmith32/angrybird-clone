<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser Angry Birds Clone</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { margin: 0; background: #0c1a2b; color: #fff; }
    #game-container { width: 100vw; height: 70vh; }
    #menu { padding: 1rem; }
  </style>
</head>
<body>
  <div id="menu" class="container-fluid bg-dark text-white">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h1 class="h4">Angry Birds Clone</h1>
        <button id="btn-play" class="btn btn-success btn-sm me-2">Play</button>
        <button id="btn-levels" class="btn btn-primary btn-sm me-2">Level Select</button>
        <button id="btn-shop" class="btn btn-warning btn-sm me-2">Shop</button>
        <button id="btn-achievements" class="btn btn-info btn-sm me-2">Achievements</button>
        <button id="btn-settings" class="btn btn-secondary btn-sm">Settings</button>
      </div>
      <div>
        <span id="subscription-status" class="badge bg-primary">Free Tier</span>
      </div>
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
