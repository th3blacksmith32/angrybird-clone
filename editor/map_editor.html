<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<div class="container py-3">
  <h1 class="h4">Map Editor</h1>
  <div class="row">
    <div class="col-md-8">
      <canvas id="editor-canvas" width="800" height="500" class="bg-secondary"></canvas>
    </div>
    <div class="col-md-4">
      <div class="mb-2">
        <label class="form-label">Level Name</label>
        <input id="level-name" class="form-control" value="custom_level" />
      </div>
      <div class="mb-2">
        <label class="form-label">Difficulty</label>
        <select id="difficulty" class="form-select"><option>easy</option><option>medium</option><option>hard</option></select>
      </div>
      <div class="mb-2">
        <label class="form-label">Add Entity</label>
        <select id="entity" class="form-select">
          <option value="pig">Pig</option>
          <option value="box">Box</option>
          <option value="tnt">TNT</option>
          <option value="bird">Bird</option>
          <option value="platform">Platform</option>
        </select>
        <input id="bird-tier" class="form-control mt-2" value="1x" placeholder="Tier (for birds)" />
      </div>
      <button id="btn-new" class="btn btn-primary btn-sm me-2">New</button>
      <button id="btn-export" class="btn btn-success btn-sm me-2">Export</button>
      <button id="btn-import" class="btn btn-warning btn-sm">Import</button>
      <textarea id="json-area" class="form-control mt-2" rows="6"></textarea>
    </div>
  </div>
</div>
<script type="module" src="./map_editor.js"></script>
<script type="module" src="./editor_ui.js"></script>
</body>
</html>
