<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
  <div class="container py-3">
    <h1 class="h4">Admin Dashboard</h1>
    <div class="mb-2">
      <label class="form-label">Admin Password</label>
      <input id="admin-pass" type="password" class="form-control" />
      <button id="btn-login" class="btn btn-primary btn-sm mt-2">Login</button>
    </div>
    <div id="dashboard" class="d-none">
      <p class="text-success">Logged in</p>
      <button id="btn-refresh" class="btn btn-secondary btn-sm">Refresh</button>
      <div id="users" class="mt-3"></div>
      <div class="mt-3">
        <h6>Send TON</h6>
        <input id="ton-address" class="form-control" placeholder="Wallet" />
        <input id="ton-amount" class="form-control mt-2" placeholder="Amount" />
        <button id="btn-send-ton" class="btn btn-warning btn-sm mt-2">Send</button>
      </div>
    </div>
  </div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
